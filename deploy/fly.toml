# Fly.io configuration for the DentalClarity public demo.
# See deploy/README.md. Run fly commands from the repository root with
# `--config deploy/fly.toml` so the whole repository is the build context.

app = "dentalclarity-demo"
primary_region = "iad"

# The server shuts down gracefully on SIGINT. SIGINT is also Fly's default.
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  # Pass the Dockerfile on the command line: --dockerfile deploy/Dockerfile.
  # Fly mounts volumes owned by root. This target fixes /data ownership at
  # start and then runs the server as uid 10001.
  build-target = "rootfix"

[env]
  DC_MODE = "demo"
  DC_BIND = "0.0.0.0:8080"
  DC_DATA_DIR = "/data"
  DC_DEMO_MONTHLY_BUDGET_USD = "25"
  # The public https address. Change it if you add a custom domain.
  DC_PUBLIC_ORIGIN = "https://dentalclarity-demo.fly.dev"
  # The certificate is managed by Fly and trusted by every browser.
  DC_HSTS = "true"
  RUST_LOG = "info"
  # Fly's proxy reaches the app over Fly's private networks and passes the
  # visitor's address in Fly-Client-IP. Only the proxy can connect from these
  # ranges, so per-visitor limits see real addresses.
  DC_TRUSTED_PROXY = "fdaa::/16, 172.16.0.0/12"
  DC_CLIENT_IP_HEADER = "fly-client-ip"
  # Secrets are not set here. Use: fly secrets set OPENROUTER_API_KEY=...

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the one machine running so visitors never wait for a cold start.
  # One machine at most, because the SQLite database lives on a single volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "dentalclarity_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
