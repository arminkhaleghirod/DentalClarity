[[passages]]
id = "what_it_is"
topic = "what_it_is"
text = "A tooth extraction means removing a tooth from its socket in the jawbone. A simple extraction is used for a tooth that has fully come in and has enough of it showing above the gums to be lifted out without cutting the gum. Many people call this having a tooth pulled."
sources = ["cc_tooth_extraction", "aaoms_simple_vs_surgical"]

[[passages]]
id = "common_reasons"
topic = "common_reasons"
text = "Common reasons include decay or damage too severe to repair with a filling or crown, advanced gum disease that has loosened a tooth, a broken tooth, or crowding. Sometimes a tooth is removed when other dental repairs can no longer save it."
sources = ["cc_tooth_extraction"]

[[passages]]
id = "what_happens"
topic = "what_happens"
text = "Your dental team numbs the tooth and the area around it, and some offices also offer ways to help you relax. They gently loosen the tooth and lift it from the socket. The socket is cleaned, and sometimes stitches or a graft material are placed. You then bite on gauze to help a blood clot form."
sources = ["cc_tooth_extraction", "aaoms_aftercare"]

[[passages]]
id = "recovery"
topic = "recovery"
text = "Follow the aftercare instructions your dental team gives you, since they help protect the blood clot in the socket while it heals. Some swelling, tenderness and light bleeding are common at first. Soft foods, gentle cleaning, and avoiding straws, smoking and forceful spitting often help. Call the practice if bleeding does not stop, if pain gets worse instead of better, or if you notice a fever."
sources = ["cc_tooth_extraction", "aaoms_aftercare"]

[[passages]]
id = "benefits"
topic = "benefits"
text = "Removing a tooth that cannot be saved is meant to relieve pain and take away a source of infection. It can also help protect the nearby teeth and gums. Your dental team can talk with you about what, if anything, will go in the space afterward."
sources = ["cc_tooth_extraction"]

[[passages]]
id = "if_delayed"
topic = "if_delayed"
text = "A badly damaged or infected tooth usually does not repair itself. Over time, it may become more painful, or an infection may spread to the gums or bone nearby. Many people choose when to have treatment after talking it over with their dental team, and that choice is yours to make with them."
sources = ["cc_tooth_extraction"]

[[passages]]
id = "questions"
topic = "questions"
text = "What should I eat and avoid while the area heals? How should I clean my mouth after the tooth is removed? What signs mean I should call the office? What are my choices for the space once the tooth is gone?"
sources = ["cc_tooth_extraction", "aaoms_aftercare"]
