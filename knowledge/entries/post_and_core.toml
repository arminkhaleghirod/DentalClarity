[[passages]]
id = "what_it_is"
topic = "what_it_is"
text = "A post and build-up is used on a tooth that has had root canal treatment and has lost a lot of its structure. A small post is placed into the cleaned-out canal inside the root, and filling material is built up around it to form a core. The post mainly helps hold the core in place, and the core gives a crown something solid to attach to."
sources = ["nih_ijd_endo_restoration"]

[[passages]]
id = "common_reasons"
topic = "common_reasons"
text = "Common reasons for a post and build-up include a root-canal-treated tooth that has lost too much of its upper part for a regular build-up to hold on its own. This often happens when large cavities, old fillings or breaks have removed much of the tooth. Dentists generally use a post only when there is not enough tooth left to support the final crown."
sources = ["nih_ijd_endo_restoration"]

[[passages]]
id = "what_happens"
topic = "what_happens"
text = "The area is usually numbed if needed. Part of the root canal filling is removed to make room, and the post is fitted and secured inside the root. Filling material is then built up around the post and shaped to form the core. After that, the tooth is prepared for a crown."
sources = ["nih_ijd_endo_restoration", "cc_crowns"]

[[passages]]
id = "recovery"
topic = "recovery"
text = "Many people feel only mild tenderness or sensitivity for a short while afterward. Until the final crown is in place, it is wise to be gentle with the tooth and avoid biting hard foods on it. Let your dental team know if the tooth or a temporary crown feels loose or your bite feels off."
sources = ["aae_post_care", "cc_crowns"]

[[passages]]
id = "benefits"
topic = "benefits"
text = "A post and build-up gives a heavily damaged, root-canal-treated tooth a base strong enough to hold a crown. The post does not make the root itself stronger, but it helps keep the core and crown in place. Together with the crown, it aims to let you keep and use the tooth."
sources = ["nih_ijd_endo_restoration", "aae_post_care"]

[[passages]]
id = "if_delayed"
topic = "if_delayed"
text = "A root-canal-treated tooth that has lost much of its structure can be fragile until it is fully restored. If the final restoration is put off, the tooth may be more likely to crack or break, and bacteria may leak back into the root over time. You can talk with your dental team about timing that works for you."
sources = ["nih_ijd_endo_restoration", "aae_post_care"]

[[passages]]
id = "questions"
topic = "questions"
text = "Why does this tooth need a post and not just a build-up? What material will the post and core be made of? How should I care for the tooth until the crown is finished?"
sources = ["nih_ijd_endo_restoration"]
