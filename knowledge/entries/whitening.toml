[[passages]]
id = "what_it_is"
topic = "what_it_is"
text = "Teeth whitening uses a bleaching gel to lighten the color of natural teeth. Your dentist can do it in the office or give you custom trays and gel to use at home. Store-bought products also exist, but they often work more slowly."
sources = ["ada_whitening", "cc_whitening_safe"]

[[passages]]
id = "common_reasons"
topic = "common_reasons"
text = "Many people whiten their teeth to brighten a smile that has yellowed over time or been stained by foods and drinks such as coffee. Whitening is a choice about appearance. A checkup first helps find out why teeth are darker, since some kinds of discoloration do not respond to bleaching."
sources = ["ada_whitening", "cc_whitening_safe"]

[[passages]]
id = "what_happens"
topic = "what_happens"
text = "Your dentist usually checks your teeth and gums first and treats any cavities or gum problems. For in-office whitening, your gums are protected and the gel is applied to your teeth. For whitening at home, your dentist makes trays shaped to your teeth and shows you how to use the gel."
sources = ["ada_whitening", "cc_whitening_safe"]

[[passages]]
id = "recovery"
topic = "recovery"
text = "It is common for teeth to feel sensitive or for gums to feel irritated during whitening. This usually fades soon after. If it bothers you, your dentist may suggest pausing or changing how you whiten."
sources = ["ada_whitening", "cc_whitening_safe"]

[[passages]]
id = "benefits"
topic = "benefits"
text = "Whitening can make natural teeth look brighter. Results fade slowly over time, especially with foods and drinks that stain. Crowns, fillings and other restorations keep their own color, so your dentist can help you plan if you have any."
sources = ["ada_whitening", "cc_whitening_safe"]

[[passages]]
id = "if_delayed"
topic = "if_delayed"
text = "Whitening is a choice about appearance, so putting it off does not harm your teeth. You can decide whether and when to whiten in your own time with your dental team."
sources = ["cc_whitening_safe"]

[[passages]]
id = "questions"
topic = "questions"
text = "Is in-office or at-home whitening a better fit for me? Will my crowns or fillings match my teeth afterward? What can I do if my teeth feel sensitive? How can I keep my teeth from staining again?"
sources = ["ada_whitening", "cc_whitening_safe"]
