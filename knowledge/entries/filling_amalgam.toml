[[passages]]
id = "what_it_is"
topic = "what_it_is"
text = "A silver filling, also called an amalgam filling, repairs a tooth that has been damaged, most often by a cavity. Amalgam is a silver-colored material made by mixing mercury with other metals such as silver, tin and copper. Major health groups consider amalgam fillings safe for most people, and your dental team can talk with you about the material if it raises questions for you."
sources = ["cc_fillings", "cc_cavities"]

[[passages]]
id = "common_reasons"
topic = "common_reasons"
text = "Common reasons for a silver filling include repairing a cavity and fixing damage from a small break. Fillings are usually used when decay has gone past the earliest stage but has not reached the inner part of the tooth."
sources = ["cc_fillings", "cc_cavities"]

[[passages]]
id = "what_happens"
topic = "what_happens"
text = "Your dentist usually numbs the area first. The decayed part of the tooth is removed, and the space is cleaned and shaped. The amalgam is pressed into the space, where it hardens, and it is then shaped and smoothed. Your dentist checks your bite to make sure it feels right."
sources = ["cc_fillings"]

[[passages]]
id = "recovery"
topic = "recovery"
text = "Many people notice mild sensitivity or sore gums for a short while, and this usually fades on its own. It helps to wait until the numbness wears off before eating so you do not bite your cheek. If your bite feels off or the tooth stays painful, let your dental team know, since a small adjustment may help."
sources = ["cc_fillings"]

[[passages]]
id = "benefits"
topic = "benefits"
text = "A filling stops the damaged area from getting worse and restores the shape of the tooth. This helps you chew comfortably and keeps the tooth working as part of your bite."
sources = ["cc_fillings", "cc_cavities"]

[[passages]]
id = "if_delayed"
topic = "if_delayed"
text = "If a cavity is not repaired, it may slowly grow larger and deeper. Decay that reaches the inner part of the tooth may need more involved care than a filling. Many cavities do not hurt at first, so the timing is something to talk over with your dental team."
sources = ["cc_fillings", "cc_cavities"]

[[passages]]
id = "questions"
topic = "questions"
text = "Which tooth is getting the filling, and how large is the area? What should I expect to feel after the numbness wears off? Can you tell me more about the filling material and why it was chosen for this tooth?"
sources = ["cc_fillings"]
