[[passages]]
id = "what_it_is"
topic = "what_it_is"
text = "An implant crown is the visible, tooth-shaped part that attaches to a dental implant. It usually connects to the implant through a small piece called an abutment, which sits just above the gum. The crown is made to match the shape and color of your nearby teeth."
sources = ["cc_dental_implants", "cc_dental_crowns"]

[[passages]]
id = "common_reasons"
topic = "common_reasons"
text = "Common reasons include finishing a tooth replacement once the implant post has healed into the bone, and bringing back chewing and appearance where a tooth is missing. The crown is the part you bite with and the part that fills the space in your smile."
sources = ["cc_dental_implants", "cc_dental_crowns"]

[[passages]]
id = "what_happens"
topic = "what_happens"
text = "Once the implant has healed, your dental team checks it and attaches the abutment if it is not already in place. In some cases, a small procedure is needed to uncover the top of the implant first. Impressions or a scan are used to make a crown that fits your bite, and the crown is then attached and checked for fit."
sources = ["cc_dental_implants"]

[[passages]]
id = "recovery"
topic = "recovery"
text = "The gums around the implant may feel a little tender at first, and this usually settles. Brush and floss around the crown each day and keep up with regular checkups and cleanings. Call the practice if the crown feels loose, cracks or chips, or if chewing on it hurts."
sources = ["cc_dental_implants", "cc_dental_crowns"]

[[passages]]
id = "benefits"
topic = "benefits"
text = "An implant crown is meant to help you chew comfortably and to fill the gap with a natural-looking tooth. Because it is held by the implant, it does not need support from the teeth beside it. Many people find it feels much like a natural tooth."
sources = ["cc_dental_implants"]

[[passages]]
id = "if_delayed"
topic = "if_delayed"
text = "An implant post without a crown does not help with chewing in that spot. Over time, nearby teeth may shift toward the open space, which can affect how a crown fits later. Your dental team can help you think about timing, and the choice is yours to make with them."
sources = ["cc_dental_bridges", "cc_dental_implants"]

[[passages]]
id = "questions"
topic = "questions"
text = "What material will my implant crown be made of? How should I clean around the crown and the implant? Could grinding or clenching affect my implant crown? How often should the implant and crown be checked?"
sources = ["cc_dental_crowns", "cc_dental_implants"]
