[[passages]]
id = "what_it_is"
topic = "what_it_is"
text = "Fluoride is a natural mineral that helps make tooth enamel stronger. A fluoride treatment at the dental office puts a concentrated form of fluoride right onto your teeth. Fluoride varnish is a common form that is painted on as a thin coating."
sources = ["nhs_childrens_teeth", "mh_fluoride"]

[[passages]]
id = "common_reasons"
topic = "common_reasons"
text = "Common reasons for a fluoride treatment include helping prevent cavities in children and adults. It is often suggested for teeth that are more likely to decay. Fluoride can also help repair very early weak spots in enamel before they become cavities."
sources = ["nhs_childrens_teeth", "mh_fluoride", "cc_cleanings"]

[[passages]]
id = "what_happens"
topic = "what_happens"
text = "Your dentist or hygienist paints a thin layer of fluoride varnish onto the surfaces of your teeth. It is usually a short and simple step, often done during a checkup or cleaning visit. Your dental team may give you a few tips about eating, drinking or brushing afterward."
sources = ["nhs_childrens_teeth", "cc_cleanings"]

[[passages]]
id = "recovery"
topic = "recovery"
text = "Most people need no recovery time after a fluoride treatment and go back to their day right away. It helps to follow any aftercare tips your dental team gives you."
sources = ["nhs_childrens_teeth"]

[[passages]]
id = "benefits"
topic = "benefits"
text = "Fluoride helps enamel stand up to the acids made by cavity-causing bacteria. It can also help repair early damage to the enamel surface. Over time, this often lowers the chance of cavities."
sources = ["mh_fluoride", "nhs_childrens_teeth"]

[[passages]]
id = "if_delayed"
topic = "if_delayed"
text = "Without extra fluoride, teeth that are prone to decay may be more likely to develop cavities over time. Daily brushing with a fluoride toothpaste still helps protect your teeth. Whether a fluoride treatment makes sense for you is something to decide with your dental team."
sources = ["mh_fluoride", "nhs_childrens_teeth"]

[[passages]]
id = "questions"
topic = "questions"
text = "Why do you suggest fluoride for me or my child? Is there anything I should do or avoid after the varnish goes on? How does this treatment fit with brushing at home?"
sources = ["nhs_childrens_teeth"]
