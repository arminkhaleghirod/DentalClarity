# Procedure code to category mapping.
#
# Keys are bare procedure codes. Names are our own plain-language wording,
# written for patients. CDT descriptor text is copyrighted by the ADA and must
# not be added to this file.
#
# A code missing from this file maps to `unsupported`, which routes the
# procedure to staff review instead of generated content.

