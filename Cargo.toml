[workspace]
resolver = "3"
members = [
    "crates/dc-core",
    "crates/dc-pms",
    "crates/dc-knowledge",
    "crates/dc-ai",
    "crates/dc-generation",
    "crates/dc-server",
    "crates/dc-web",
    "crates/clarityeval",
]
default-members = [
    "crates/dc-core",
    "crates/dc-pms",
    "crates/dc-knowledge",
    "crates/dc-ai",
    "crates/dc-generation",
    "crates/dc-server",
    "crates/clarityeval",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/arminkhaleghirod/DentalClarity"

[workspace.dependencies]
dc-core = { path = "crates/dc-core" }
dc-pms = { path = "crates/dc-pms" }
dc-knowledge = { path = "crates/dc-knowledge" }
dc-ai = { path = "crates/dc-ai" }
dc-generation = { path = "crates/dc-generation" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true

# Password hashing is slow without optimizations; keep dev builds and tests fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
