[package]
name = "dc-server"
description = "DentalClarity application server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dentalclarity"
path = "src/main.rs"

[features]
default = ["opendental"]
# The read-only Open Dental connector for clinical mode.
opendental = ["dc-pms/opendental"]

[dependencies]
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std"] }
async-trait.workspace = true
axum.workspace = true
base64 = "0.22"
dotenvy = "0.15"
futures = "0.3"
dc-ai.workspace = true
dc-core.workspace = true
dc-generation.workspace = true
dc-knowledge.workspace = true
dc-pms.workspace = true
getrandom = "0.3"
hex.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle = "2"
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower.workspace = true
