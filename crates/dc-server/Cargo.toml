[package]
name = "dc-server"
description = "DentalClarity application server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dentalclarity"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum-server = { version = "0.9", features = ["tls-rustls"] }
argon2 = { version = "0.5", features = ["std"] }
async-trait.workspace = true
axum.workspace = true
base64 = "0.22"
dotenvy = "0.15"
futures = "0.3"
dc-ai.workspace = true
dc-core.workspace = true
dc-generation.workspace = true
dc-knowledge.workspace = true
dc-pms.workspace = true
getrandom = "0.3"
hex.workspace = true
rcgen = "0.14"
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
subtle = "2"
time = "0.3"
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
# Bedrock and Polly for clinical mode (docs/DECISIONS.md D13, D14).
aws = ["dc-ai/aws"]

[dev-dependencies]
reqwest.workspace = true
tower.workspace = true
