[package]
name = "dc-web"
description = "DentalClarity web app (staff workspace and patient presentation), compiled to WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
console_error_panic_hook = "0.1"
dc-core.workspace = true
gloo-net = { version = "0.8", default-features = false, features = ["http", "json"] }
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde.workspace = true
